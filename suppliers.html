<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Supplier Directory | Miya Labs
  </title>

  <meta
    name="description"
    content="Explore cosmetic ingredient manufacturers and suppliers through the Miya Labs supplier directory."
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="site-header">

  <a
    class="brand"
    href="index.html"
    aria-label="Miya Labs home"
  >

    MIYA<span>LABS</span>

  </a>


  <nav aria-label="Main navigation">

    <a href="ingredients.html">
      Ingredients
    </a>

    <a href="index.html#formulation">
      Formulation
    </a>

    <a
      href="suppliers.html"
      class="active"
    >
      Suppliers
    </a>

    <a href="index.html#guides">
      Guides
    </a>

  </nav>

</header>



<main>


<section class="page-intro">

  <p class="eyebrow">
    MIYA LABS DATABASE
  </p>


  <h1>
    Supplier Directory
  </h1>


  <p>

    Discover manufacturers and suppliers
    connected to cosmetic ingredients.

  </p>

</section>



<section class="directory-controls">


  <div class="search-field">

    <label for="supplier-search">
      Search suppliers or ingredients
    </label>


    <input
      id="supplier-search"
      type="search"
      placeholder="Supplier, ingredient..."
      autocomplete="off"
    >

  </div>



  <div class="filter-field">

    <label for="supplier-type">
      Supplier type
    </label>


    <select id="supplier-type">

      <option value="all">
        All suppliers
      </option>

    </select>

  </div>


</section>



<section
  class="directory-section"
  aria-live="polite"
>


  <div
    id="supplier-results"
    class="supplier-grid"
  >

    <div class="directory-placeholder">

      <strong>
        Loading suppliers...
      </strong>

    </div>

  </div>


</section>


</main>



<footer>

  <div class="brand">
    MIYA<span>LABS</span>
  </div>


  <p>
    Cosmetic ingredients · formulation ·
    supplier intelligence
  </p>


  <div class="footer-links">

    <a href="index.html">
      Home
    </a>

    <a href="ingredients.html">
      Ingredients
    </a>

    <a href="suppliers.html">
      Suppliers
    </a>

  </div>


  <small>
    © 2026 Miya Labs.
  </small>

</footer>



<script src="suppliers.js"></script>


</body>

</html>
